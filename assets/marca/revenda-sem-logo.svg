<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A revenda que ainda não subiu a logo: uma lojinha com um botijão
       e um galão na vitrine. Os dois são os mesmos desenhos da escolha
       de itens, para o cliente reconhecer de onde vêm. -->

  <!-- toldo -->
  <ellipse cx="50" cy="21" rx="17" ry="7" fill="#0b2d52"/>
  <rect x="14" y="20" width="72" height="8" rx="3" fill="#0b2d52"/>
  <polygon points="16,28 84,28 91,41 9,41" fill="#fff" stroke="#0b2d52" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="16,28 25.7,28 20.7,41 9,41" fill="#0b2d52"/>
  <polygon points="35.4,28 45.1,28 44.1,41 32.4,41" fill="#0b2d52"/>
  <polygon points="54.9,28 64.6,28 67.6,41 55.9,41" fill="#0b2d52"/>
  <polygon points="74.3,28 84,28 91,41 79.3,41" fill="#0b2d52"/>

  <!-- a loja, a porta e a vitrine -->
  <rect x="14" y="41" width="72" height="45" fill="#fff" stroke="#0b2d52" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="20" y="49" width="15" height="31" rx="1" fill="none" stroke="#0b2d52" stroke-width="3"/>
  <rect x="41" y="49" width="39" height="25" rx="1" fill="#fff" stroke="#0b2d52" stroke-width="3"/>

  <!-- botijão -->
  <rect x="48.5" y="69" width="8" height="2" fill="#b9650b"/>
  <rect x="49.5" y="54" width="6" height="4" rx="1.2" fill="#b9650b"/>
  <rect x="51" y="55" width="3" height="1.6" rx="0.8" fill="#fff" opacity="0.6"/>
  <rect x="47" y="57" width="11" height="13" rx="3.5" fill="#ef8a17"/>
  <rect x="48.6" y="59.5" width="1.4" height="7" rx="0.7" fill="#fff" opacity="0.35"/>

  <!-- galão -->
  <rect x="68.3" y="54.5" width="3.4" height="4" fill="#d6ecff" stroke="#0093fc" stroke-width="1"/>
  <rect x="67.5" y="53" width="5" height="2.4" rx="0.6" fill="#0b72c9"/>
  <rect x="63.5" y="58" width="13" height="13" rx="3" fill="#d6ecff" stroke="#0093fc" stroke-width="1.2"/>
  <line x1="65.5" x2="74.5" y1="61.2" y2="61.2" stroke="#0093fc" stroke-width="0.8" opacity="0.7"/>
  <line x1="65.5" x2="74.5" y1="67.8" y2="67.8" stroke="#0093fc" stroke-width="0.8" opacity="0.7"/>
</svg>
