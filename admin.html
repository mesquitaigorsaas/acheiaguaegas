<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel do administrador — Achei Água &amp; Gás</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/formulario.css">

    <style>
        /* Feita para o celular, com uma mão só: cartão grande, botão
           largo e nada de tabela que role para o lado. No computador
           ela só ganha margem. */

        /* O display dos botões ganharia do atributo hidden sem esta
           linha, e o "Sair" aparecia para quem nem entrou. */
        [hidden] { display: none !important; }

        .admin-limite { max-width: 680px; margin: 0 auto; padding: 16px; }

        .admin-botoes-topo { display: flex; gap: 8px; flex: none; }
        .admin-botoes-topo .botao-vazio { width: auto; }

        .admin-topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .admin-topo h1 { font-family: var(--titulo); font-size: 1.15rem; color: var(--marinho); }
        .admin-conta { font-size: 0.8rem; color: var(--tinta-fraca); margin-bottom: 12px; }

        /* FILTROS */
        .filtros {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin: 10px 0;
        }

        .filtro {
            flex: none;
            border: 1px solid var(--linha);
            background: var(--papel);
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .filtro span { color: var(--tinta-fraca); font-weight: 500; }

        .filtro.escolhido {
            background: var(--marinho);
            border-color: var(--marinho);
            color: #fff;
        }

        .filtro.escolhido span { color: #cfe3f7; }

        .linha-busca { display: flex; gap: 8px; margin-bottom: 14px; }
        .linha-busca input {
            flex: 1;
            min-width: 0;
            min-height: 44px;
            padding: 10px 12px;
            background: var(--papel);
            border: 1.5px solid var(--linha);
            border-radius: var(--raio);
            outline: none;
        }

        .linha-busca input:focus { border-color: var(--agua); }
        .linha-busca .botao-vazio { width: auto; min-height: 44px; }

        /* O CARTÃO */
        .revenda {
            border: 1px solid var(--linha);
            border-radius: 14px;
            background: var(--papel);
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: var(--sombra);
        }

        .revenda h2 { font-size: 1.05rem; margin: 2px 0; }

        .revenda .linha {
            font-size: 0.86rem;
            color: #475569;
            margin-top: 3px;
            word-break: break-word;
        }

        .revenda .linha strong { color: #0f172a; font-weight: 600; }

        .selo {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: .3px;
            padding: 3px 9px;
            border-radius: 999px;
        }

        .selo.aguardando_pagamento { background: #fff4ec; color: #9a3412; }
        .selo.ativa                { background: #e7f5ec; color: #157a43; }
        .selo.suspensa             { background: #fee2e2; color: #991b1b; }
        .selo.cancelada            { background: #e5e7eb; color: #374151; }

        .grupo-botoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .grupo-botoes > * { flex: 1 1 140px; }

        .botao-perigo {
            background: var(--papel);
            color: var(--vermelho);
            border: 1.5px solid #f3c2bd;
        }

        .botao-perigo:hover { background: var(--vermelho-claro); }

        .botao-bloquear { background: #b45309; color: #fff; }
        .botao-bloquear:hover { background: #92400e; }

        /* O plano nasce marcado com o que a revenda escolheu. Trocar é
           para o comprovante que veio com outro valor. */
        .escolha-plano { display: flex; gap: 8px; margin: 12px 0 0; }

        .escolha-plano label {
            flex: 1;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 9px 6px;
            text-align: center;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .escolha-plano input { position: absolute; opacity: 0; pointer-events: none; }

        .escolha-plano label:has(input:checked) {
            border-color: #2563eb;
            background: #eff6ff;
            color: #1d4ed8;
            font-weight: 700;
        }

        /* DETALHES E EDIÇÃO */
        .painel-extra {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--linha);
        }

        .painel-extra h3 { font-size: 0.9rem; margin: 10px 0 6px; color: var(--marinho); }

        .tabela-mini { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        .tabela-mini td { padding: 5px 4px; border-bottom: 1px solid #eef2f7; }
        .tabela-mini td:last-child { text-align: right; white-space: nowrap; }
        .tabela-mini .apagado { color: #94a3b8; text-decoration: line-through; }

        .duas-colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }

        .marcar { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; margin: 6px 0 12px; }
        .marcar input { width: 20px; height: 20px; }

        .vazio {
            text-align: center;
            color: #64748b;
            padding: 36px 12px;
            font-size: 0.95rem;
        }

        .recado.ok { background: var(--verde-claro); border-color: #bbf7d0; color: var(--verde); }
    </style>
</head>

<body>

    <main class="admin-limite">

        <div class="admin-topo">
            <h1>Painel do administrador</h1>
            <div class="admin-botoes-topo">
                <a class="botao-vazio botao-miudo" href="./">Voltar ao site</a>
                <button type="button" class="botao-vazio botao-miudo" id="botao-sair" hidden>Sair</button>
            </div>
        </div>
        <p class="admin-conta" id="quem-sou"></p>

        <p id="recado" class="recado" role="alert" hidden></p>

        <!-- ENTRAR -->
        <section class="passo" id="bloco-entrar" hidden>
            <h2>Entrar</h2>
            <p class="explica">Use a conta cadastrada como administrador.</p>

            <form id="form-entrar">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="linha-senha">
                        <input type="password" id="senha" autocomplete="current-password" required>
                        <button type="button" class="botao-vazio botao-miudo" data-ver-senha="senha">Mostrar</button>
                    </div>
                </div>

                <button type="submit" class="botao" id="botao-entrar">Entrar</button>
            </form>
        </section>

        <!-- A LISTA -->
        <section id="bloco-lista" hidden>
            <div class="filtros" id="filtros" role="group" aria-label="Filtrar por situação"></div>

            <div class="linha-busca">
                <input type="search" id="busca" placeholder="Buscar por nome, CNPJ, cidade ou e-mail" autocomplete="off">
                <button type="button" class="botao-vazio botao-miudo" id="botao-atualizar">Atualizar</button>
            </div>

            <div id="lista"></div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/banco.js"></script>
    <script src="js/estados.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>
